services:
  api:
    container_name: booking-service-api
    build:
      context: ./BookingService
      dockerfile: API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      OTLP_ENDPOINT: http://jaeger:4317
      ConnectionStrings__Mongo: mongodb://mongo:27017
      RabbitMQ__Host: rabbit
    depends_on:
      - mongo
      - rabbit
    networks:
      - internal
  
#  worker:
#    container_name: booking-service-worker
#    build:
#      context: ./BookingService/Worker
#    networks:
#      - internal

  notification:
    container_name: booking-service-notification
    build:
      context: ./BookingService
      dockerfile: Notification/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_HTTP_PORTS: 8081
      RabbitMQ__Host: rabbit
    depends_on:
      - rabbit
    networks:
      - internal
  
  mongo:
    image: mongodb/mongodb-community-server:9.0-ubi9-slim
    container_name: booking-service-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - internal
  
  rabbit:
    image: rabbitmq:4.3.7-management
    container_name: booking-service-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - internal
  
  prometheus:
    image: prom/prometheus:v3
    container_name: booking-service-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yaml:/etc/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus.yaml
    networks:
      - internal
  
  jaeger:
    container_name: booking-service-jaeger
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # ui
      - "4317:4317" # otlp grpc
    networks:
      - internal

  grafana:
    container_name: booking-service-grafana
    image: grafana/grafana:12.0.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - internal

networks:
  internal:

volumes:
  mongo_data:
  rabbitmq_data:
  prometheus_data: