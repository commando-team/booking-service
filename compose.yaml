#        
#  notification:
#    container_name: booking-service-notification
#    build:
#      context: ./BookingService/Notification
#    networks:
#      - internal
  
  jaeger:
    container_name: booking-service-jaeger
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # ui
      - "4317:4317" # otlp grpc
    networks:
      - internal

networks:
  internal:
  