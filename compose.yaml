services:
  api:
    container_name: booking-service-api
    build:
      context: ./BookingService/API
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      OTLP_ENDPOINT: http://jaeger:4317
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=booking-service;Username=postgres;Password=1234
    networks:
      - internal
  
#  worker:
#    container_name: booking-service-worker
#    build:
#      context: ./BookingService/Worker
#    networks:
#      - internal
#        
#  notification:
#    container_name: booking-service-notification
#    build:
#      context: ./BookingService/Notification
#    networks:
#      - internal
  
  db:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: booking-service
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - internal
  
  prometheus:
    image: prom/prometheus:v3
    container_name: booking-service-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yaml:/etc/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus.yaml
    networks:
      - internal
  
  jaeger:
    container_name: booking-service-jaeger
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # ui
      - "4317:4317" # otlp grpc
    networks:
      - internal

networks:
  internal:

volumes:
  pg_data:
  prometheus_data: